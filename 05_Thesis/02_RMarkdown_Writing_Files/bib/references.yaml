- id: Takeyasu2017Effects
  abstract: >-
    This chapter assesses the influence of preceding vowel duration on the
    perception of singleton/geminate stops in Japanese. Through a perception
    experiment, it is shown that the identification of consonant length
    (singleton/geminate) is affected by both the physical duration and the
    phonological length of the preceding vowel, the former being an
    ‘assimilative’ effect and the latter being a ‘contrastive’ effect. The
    physical duration and the phonological length of the following consonant
    affect the identification of vowel length (short/long), but the former
    effect is not observable when the following consonant is perceived as
    geminate. Results of a production experiment also demonstrate that the
