- id: Johnson1997auditory
  abstract: >-
    Language is temporal in two ways. Words and sentences occur in time, each
    utterance having a beginning and end. But, also the learner's experience of
    language occurs over time, the items that are crucial for defining
    linguistic structure are experienced over the course of years. These two
    observations are addressed in an exemplar model of phonological learning and
    word recognition. Major features of the model are described and its
    operation is illustrated in two simulations.
