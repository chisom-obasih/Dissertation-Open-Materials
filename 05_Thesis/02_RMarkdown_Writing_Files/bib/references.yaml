- id: Alqarhi2019Arabic
  abstract: >-
    The phenomenon seen in domains more than one is termed as Language
    Hybridization. Many languages have multiple dialects that tend to differ in
    the phonology concept. The Arabic language that is spoken in contemporary
    time can be more properly described as varieties having a continuum. The
    modern and standard Arabic language consists of twenty eight consonant
    phonemes along with six phonemes that might also be eight vowel in most of
    the modern dialects. Every phonemes have a contrast between non-emphatic
    consonants and uvularized or emphatic consonants. Few of the phonemes have
    also found to get coalesced into various other modern dialects whereas on
    the other hand, the new phonemes have already been introduced via phonemic
    splits or borrowing. The phonemic length and quality that applies to both
    consonants and vowels at the same time. There have been research that
    analyses how multicultural society in Australia gets operated only with a
    particular form of language generated in some linguistic environments. The
    scripts of English Language tend to have the capability of merging with
    other language that are native of a place for making it a complete new
    variety. The process is termed as Romanization. The hybrid or amalgamation
    of languages within the linguistic framework can be classified and
    characterized that makes its standardization easy. This paper aims to do a
    complete research on the linguistics of Arabic phonology.
