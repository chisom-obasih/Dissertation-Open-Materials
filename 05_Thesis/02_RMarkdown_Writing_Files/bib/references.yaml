- id: McMurray2023acquisition
  abstract: >-
    An early achievement in language is carving a variable acoustic space into
    categories. The canonical story is that infants accomplish this by the
    second year, when only unsupervised learning is plausible. I challenge this
    view, synthesising five lines of developmental, phonetic and computational
    work. First, unsupervised learning may be insufficient given the statistics
    of speech (including infant-directed). Second, evidence that infants “have”
    speech categories rests on tenuous methodological assumptions. Third, the
    fact that the ecology of the learning environment is unsupervised does not
    rule out more powerful error driven learning mechanisms. Fourth, several
    implicit supervisory signals are available to older infants. Finally,
    development is protracted through adolescence, enabling richer avenues for
    development. Infancy may be a time of organising the auditory space, but
    true categorisation only arises via complex developmental cascades later in
    life. This has implications for critical periods, second language
    acquisition, and our basic framing of speech perception.
