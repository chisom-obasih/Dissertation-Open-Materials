- id: Samuel2009Perceptual
  abstract: >-
    Adult language users have an enormous amount of experience with speech in
    their native language. As a result, they have very well-developed processes
    for categorizing the sounds of speech that they hear. Despite this very high
    level of experience, recent research has shown that listeners are capable of
    redeveloping their speech categorization to bring it into alignment with new
    variation in their speech input. This reorganization of phonetic space is a
    type of perceptual learning, or recalibration, of speech processes. In this
    article, we review several recent lines of research on perceptual learning
    for speech.
