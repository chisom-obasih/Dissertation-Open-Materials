- id: Flege2021Revised
  abstract: >-
    Here we present the revised Speech learning model (SLM-r), an individual
    differences model which aims to account for how phonetic systems reorganize
    over the life span in response to the phonetic input received during
    naturalistic second language (L2) learning. We first review research leading
    to the formulation of Speech Learning Model, or SLM (Flege, 1995), before
    presenting a synthesis of that model and then its revision. The SLM-r
    proposes that the mechanisms and processes needed for native language (L1)
    acquisition remain accessible for use in L2 learning, without change or
    exception, across the life span. By hypothesis, the formation or
    non-formation of new phonetic categories for L2 sounds will depend on the
    precision of L1 categories at the time L2 learning begins, the perceived
    phonetic dissimilarity of an L2 sound from the closest L1 sound, and the
    quantity and quality of L2 input that has been received. According to the
    SLM-r, the phonetic categories making up the L1 and L2 phonetic subsystems
    interact with one another dynamically and are updated whenever the
    statistical properties of the input distributions defining L1, L2, and
    composite L1-L2 categories (diaphones) change.
