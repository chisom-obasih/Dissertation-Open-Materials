- id: Fuhrmeister2021Structural
  abstract: >-
    Listeners perceive speech sounds categorically. While group-level
    differences in categorical perception have been observed in children or
    individuals with reading disorders, recent findings suggest that typical
    adults vary in how categorically they perceive sounds. The current study
    investigated neural sources of individual variability in categorical
    perception of speech. Fifty-seven participants rated phonetic tokens on a
    visual analogue scale; categoricity and response consistency were measured
    and related to measures of brain structure from MRI. Increased surface area
    of the right middle frontal gyrus predicted more categorical perception of a
    fricative continuum. This finding supports the idea that frontal regions are
    sensitive to phonetic category-level information and extends it to make
    behavioral predictions at the individual level. Additionally, more
    gyrification in bilateral transverse temporal gyri predicted less consistent
    responses on the task, perhaps reflecting subtle variation in language
    ability across the population.
