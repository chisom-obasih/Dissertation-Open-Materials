- id: MacMillan2002Signal
  abstract: >-
    In perceptual, cognitive, and diagnostic tasks, accuracy depends on both
    limited sensitivity and the application of a decision process. By making
    explicit assumptions about the nature of the cognitive representation,
    signal detection theory (SDT) measures the contributions of these two
    components of performance. (Other approaches to assessing accuracy also
    constrain possible representations, although not all are explicit about
    their assumptions.) The receiver-operating characteristic (ROC) curve, which
    takes account of response bias in decision-making by examining conditions in
    which this bias varies, is a valuable tool for sensitivity measurement: The
    ROC curve provides an assumption-free index of accuracy, and is also used to
    distinguish among competing representations. The simplest form of SDT
    assumes that different stimulus possibilities lead to distributions of
    strength on a decision axis, and this model can be applied to many
    experimental paradigms in which a single stimulus is presented on each
    trial. Using more complex representations in which distributions lie in a
    multidimensional space, SDT predicts the relation between different
    paradigms for measuring accuracy (e.g., two-alternative forced-choice,
    same-different). Multidimensional representations also describe the
    classification and identification of stimuli from complex stimulus sets, and
    are particularly useful in analyses of perceptual interaction and attention.
