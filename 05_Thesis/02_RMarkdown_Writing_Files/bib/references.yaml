- id: Kamusella2017Arabic
  abstract: >-
    Standard Arabic is directly derived from the language of the Quran. The
    Arabic language of the holy book of Islam is seen as the prescriptive
    benchmark of correctness for the use and standardization of Arabic. As such,
    this standard language is removed from the vernaculars over a millennium
    years, which Arabic-speakers employ nowadays in everyday life. Furthermore,
    standard Arabic is used for written purposes but very rarely spoken, which
    implies that there are no native speakers of this language. As a result, no
    speech community of standard Arabic exists. Depending on the region or
    state, Arabs (understood here as Arabic speakers) belong to over 20
    different vernacular speech communities centered around Arabic dialects.
    This feature is unique among the so-called “large languages” of the modern
    world. However, from a historical perspective, it can be likened to the
    functioning of Latin as the sole (written) language in Western Europe until
    the Reformation and in Central Europe until the mid-19th century. After the
    seventh to ninth century, there was no Latin-speaking community, while in
    day-to-day life, people who employed Latin for written use spoke
    vernaculars. Afterward these vernaculars replaced Latin in written use also,
    so that now each recognized European language corresponds to a speech
    community. In future, faced with the demands of globalization, the diglossic
    nature of Arabic may yet yield a ternary polyglossia (triglossia): with the
    vernacular for everyday life; standard Arabic for formal texts, politics,
    and religion; and a western language (English, French, or Spanish) for
    science, business technology, and the perusal of belles-lettres.
