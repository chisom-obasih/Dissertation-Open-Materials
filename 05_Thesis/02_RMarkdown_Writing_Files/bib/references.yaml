- id: Honda2024Exploring
  abstract: >-
    Successfully perceiving speech sounds is a crucial skill for spoken
    communication; yet individuals show differences in how they perceive both
    native and nonnative speech sounds. We studied the relationships between
    performance on different native and nonnative speech perception tasks,
    ﬁnding that (a) different tasks measure different subtleties and (b) people
    with consistent perception of native speech sounds tend to be better at
    accurately perceiving nonnative sounds. These ﬁndings have implications for
    understanding the nature of individual differences in speech perception and
    for helping adults to learn new languages successfully.
