- id: vandenBerg2022Language
  abstract: >-
    <sec><title>Introduction</title><p>It has been proposed that bilinguals’
    language use patterns are differentially associated with executive control.
    To further examine this, the present study relates the social diversity of
    bilingual language use to performance on a color-shape switching task (CSST)
    in a group of bilingual university students with diverse linguistic
    backgrounds. Crucially, this study used language entropy as a measure of
    bilinguals’ language use patterns. This continuous measure reflects a
    spectrum of language use in a variety of social contexts, ranging from
    compartmentalized use to fully integrated
    use.</p></sec><sec><title>Methods</title><p>Language entropy for university
    and non-university contexts was calculated from questionnaire data on
    language use. Reaction times (RTs) were measured to calculate global RT and
    switching and mixing costs on the CSST, representing conflict monitoring,
    mental set shifting, and goal maintenance, respectively. In addition, this
    study innovatively recorded a potentially more sensitive measure of set
    shifting abilities, namely, pupil size during task
    performance.</p></sec><sec><title>Results</title><p>Higher university
    entropy was related to slower global RT. Neither university entropy nor
    non-university entropy were associated with switching costs as manifested in
    RTs. However, bilinguals with more compartmentalized language use in
    non-university contexts showed a larger difference in pupil dilation for
    switch trials in comparison with non-switch trials. Mixing costs in RTs were
    reduced for bilinguals with higher diversity of language use in
    non-university contexts. No such effects were found for university
    entropy.</p></sec><sec><title>Discussion</title><p>These results point to
    the social diversity of bilinguals’ language use as being associated with
    executive control, but the direction of the effects may depend on social
    context (university vs. non-university). Importantly, the results also
    suggest that some of these effects may only be detected by using more
    sensitive measures, such as pupil dilation. The paper discusses theoretical
    and practical implications regarding the language entropy measure and the
    cognitive effects of bilingual experiences more generally, as well as how
    methodological choices can advance our understanding of these
    effects.</p></sec>
