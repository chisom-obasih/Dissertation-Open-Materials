- id: Gelman2019Rsquared
  abstract: >-
    The usual definition of R2 (variance of the predicted values divided by the
    variance of the data) has a problem for Bayesian fits, as the numerator can
    be larger than the denominator. We propose an alternative definition similar
    to one that has appeared in the survival analysis literature: the variance
    of the predicted values divided by the variance of predicted values plus the
    expected variance of the errors.
