- id: Baese-Berk2018Perceptual
  abstract: >-
    In order to successfully perceive a language, a listener must be able to
    flexibly adapt to their input; however, a listener must also maintain the
    stability of their perceptual system, in order to maintain its integrity.
    Given the competing requirements of demonstrating flexibility while
    maintaining stability, it is critically important to understand under what
    circumstances listeners will demonstrate flexibility and under what
    circumstances they will not. In this chapter, I address this question using
    three types of perceptual learning for speech: perceptual flexibility of
    existing speech sound categories, acquisition of novel speech sound
    categories, and adaptation to unfamiliar accented speakers. These types of
    learning highlight the importance of balancing flexibility and stability in
    the perceptual system. In addition to highlighting previous results, their
    implications for language production and language learning are explored.
    Further, exploring these three types of learning together underscore the
    importance of investigating speakers and listeners from a variety of
    language backgrounds.
