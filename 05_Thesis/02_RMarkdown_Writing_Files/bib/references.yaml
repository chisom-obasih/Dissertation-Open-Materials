- id: Wagner2023Does
  abstract: >-
    Research examining the cognitive consequences of bilingualism has
    increasingly relied on continuous measures to capture the degree and nature
    of bilingual experience, using such variables as proficiency, age of
    acquisition, and language environments. One such measure, language entropy,
    indexes the social diversity of contexts in which each language is used. The
    construct was developed in a particular bilingual context, Montréal, Canada.
    The present study investigated the extent to which it also applies to a
    context in which social language use is substantially different from that of
    Montréal – namely, Toronto, Canada. Following the procedures in the original
    study, participants were assigned an entropy score and performed the
    AX-Continuous Performance Task (AX-CPT). Performance was associated with
    self-rated language proficiency, but unlike the results from Montréal, was
    not associated with entropy scores. Therefore, differences in the language
    context influence whether language entropy is related to behavioral
    performance on a cognitive task.
