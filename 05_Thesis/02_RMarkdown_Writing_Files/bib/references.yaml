- id: Kong2016Individual
  abstract: >-
    This study examined individual differences in categorical perception and the
    use of multiple acoustic cues in the perception of the stop voicing
    contrast. Goals were to investigate whether gradiency of speech perception
    was related to listeners’ differential sensitivity to acoustic cues and to
    individual differences in executive function. The experiment included two
    speech perception tasks (visual analogue scaling [VAS] and anticipatory eye
    movement [AEM]) administered to 30 English-speaking adults in two separate
    experimental sessions. Stimuli were a /ta/ to /da/ continuum that
    systematically varied VOT and f0. Findings were that some listeners had a
    more gradient pattern of responses on the VAS task; the listeners who had a
    gradient response pattern on the VAS task also showed more sensitivity to f0
    on the AEM task. The patterns were consistent across individuals tested on
    two separate occasions. These results suggest that variability in how
    categorically listeners perceive speech sounds is consistent and systematic
    within individuals.
