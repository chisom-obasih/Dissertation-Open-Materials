- id: Bradlow1999Training
  abstract: >-
    Previous work from our laboratories has shown that monolingual Japanese
    adults who were given intensive high-variability perceptual training
    improved in both perception and production of English /r/-/l/ minimal pairs.
    In this study, we extended those findings by investigating the long-term
    retention of learning in both perception and production of this difficult
    non-native contrast. Results showed that 3 months after completion of the
    perceptual training procedure, the Japanese trainees maintained their
    improved levels of performance on the perceptual identification task.
    Furthermore, perceptual evaluations by native American English listeners of
    the Japanese trainees’ pretest, posttest, and 3-month follow-up speech
    productions showed that the trainees retained their long-term improvements
    in the general quality, identifiability, and overall intelligibility of
    their English /r/-/l/ word productions. Taken together, the results provide
    further support for the efficacy of high-variability laboratory speech sound
    training procedures, and suggest an optimistic outlook for the application
    of such procedures for a wide range of “special populations.” nt]mis|This
    work was supported by NIDCD Training Grant DC-00012 and by NIDCD Research
    Grant DC-00111 to Indiana University.
