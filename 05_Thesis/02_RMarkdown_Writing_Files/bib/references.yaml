- id: Tajima2003Perception
  abstract: >-
    Native English listeners’ perception of Japanese phonemic length contrasts
    was investigated using a minimalpair identiﬁcation task with Japanese words
    that differed by the length of a vowel or consonant, e.g., “haken”–“hakken”.
    Identiﬁcation accuracy was found to be higher for listeners with Japanese
    exposure than for unexposed listeners, and higher after ﬁve days of
    perceptual identiﬁcation training than before. Even though listeners were
    trained to identify words containing vowel length contrasts only, accuracy
    improved for other length contrasts also. However, accuracy was relatively
    poor when the contrasts occurred in certain positions within the target
    word. In sum, while training improved English listeners’ perceptual ability,
    a signiﬁcant gap remained before they reached native-like performance.
