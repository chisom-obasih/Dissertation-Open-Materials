- id: Lehet2017DimensionBased
  abstract: >-
    Multiple acoustic dimensions signal speech categories. However, dimensions
    vary in their informativeness; some are more diagnostic of category
    membership than others. Speech categorization reﬂects these dimensional
    regularities such that diagnostic dimensions carry more “perceptual weight”
    and more effectively signal category membership to native listeners. Yet
    perceptual weights are malleable. When short-term experience deviates from
    long-term language norms, such as in a foreign accent, the perceptual weight
    of acoustic dimensions in signaling speech category membership rapidly
    adjusts. The present study investigated whether rapid adjustments in
    listeners’ perceptual weights in response to speech that deviates from the
    norms also affects listeners’ own speech productions. In a word recognition
    task, the correlation between two acoustic dimensions signaling consonant
    categories, fundamental frequency (F0) and voice onset time (VOT), matched
    the correlation typical of English, and then shifted to an “artiﬁcial
    accent” that reversed the relationship, and then shifted back. Brief,
    incidental exposure to the artiﬁcial accent caused participants to
    down-weight perceptual reliance on F0, consistent with previous research.
    Throughout the task, participants were intermittently prompted with pictures
    to produce these same words. In the block in which listeners heard the
    artiﬁcial accent with a reversed F0 9 VOT correlation, F0 was a less robust
    cue to voicing in listeners’ own speech productions. The statistical
    regularities of short-term speech input affect both speech perception and
    production, as evidenced via shifts in how acoustic dimensions are weighted.
