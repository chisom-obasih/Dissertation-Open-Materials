- id: Li2021Bilingual
  abstract: >-
    How bilinguals’ experience in managing multiple languages in different
    communicative contexts influences the cognitive and neural aspects of
    executive functions remains unclear. Therefore, we examined whether
    variations in language experience in young adult bilinguals were associated
    with data-driven brain functional network patterns (connectivity and signal
    variability) defined by performance during executive control tasks (Stroop
    and task-switching). Multiple aspects of language experience, such as the
    extent of balanced bilingualism in language proficiency and usage, and
    language diversity across social contexts (i.e., language entropy) were
    assessed. We found that greater language diversity, rather than balanced
    bilingualism per se, was related to higher brain network specialization and
    segregation concentrated on the default mode and executive control networks,
    and lower signal variability, a pattern linked to smaller RT-indices related
    to executive functioning of shifting, goal-maintenance, and
    conflict-monitoring. Our findings underscore the important role of language
    diversity in influencing bilinguals’ neurocognitive characteristics of
    executive functioning.
