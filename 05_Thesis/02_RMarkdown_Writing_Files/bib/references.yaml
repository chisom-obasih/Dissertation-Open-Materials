- id: Kong2023Individual
  abstract: >-
    This study investigated individual differences in Korean adult learners’
    categorical perception of L2 English stops with an aim to explore the
    relationship of gradient categorizations to perceptual sensitivity to
    acoustic cues and L2 proficiency. Korean young adult L2 learners of English
    (N = 49) participated in two speech perception tasks (visual analog scaling
    and forced-choice identification) in which they listened to English voiced
    and voiceless stops and Korean lax and aspirated stops with Voice Onset Time
    (VOT) and F0 manipulated to form a continuum. It was found that in both L1
    and L2 stop perception, listeners’ gradient category judgment was associated
    with greater reliance on language-specific redundant cues (i.e., F0 in L2
    English and VOT in L1 Korean) and that in the perception of L2 stops,
    categorical listeners who tended to be less sensitive to F0 were the ones
    with a higher level of L2 English proficiency. The results suggest that the
    categorical manner of judging L2 stops reflects learners’ better knowledge
    of L2-specific acoustic cue-weightings, based on which less relevant
    acoustic information is effectively suppressed.
