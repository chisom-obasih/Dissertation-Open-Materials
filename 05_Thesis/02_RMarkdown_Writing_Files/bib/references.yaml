- id: Myers2014Emergence
  abstract: >-
    Over the course of development, speech sounds that are contrastive in one's
    native language tend to become perceived categorically: that is, listeners
    are unaware of variation within phonetic categories while showing excellent
    sensitivity to speech sounds that span linguistically meaningful phonetic
    category boundaries. The end stage of this developmental process is that the
    perceptual systems that handle acoustic-phonetic information show special
    tuning to native language contrasts, and as such, category-level information
    appears to be present at even fairly low levels of the neural processing
    stream. Research on adults acquiring non-native speech categories offers an
    avenue for investigating the interplay of category-level information and
    perceptual sensitivities to these sounds as speech categories emerge. In
    particular, one can observe the neural changes that unfold as listeners
    learn not only to perceive acoustic distinctions that mark non-native speech
    sound contrasts, but also to map these distinctions onto category-level
    representations. An emergent literature on the neural basis of novel and
    non-native speech sound learning offers new insight into this question. In
    this review, I will examine this literature in order to answer two key
    questions. First, where in the neural pathway does sensitivity to
    category-level phonetic information first emerge over the trajectory of
    speech sound learning? Second, how do frontal and temporal brain areas work
    in concert over the course of non-native speech sound learning? Finally, in
    the context of this literature I will describe a model of speech sound
    learning in which rapidly-adapting access to categorical information in the
    frontal lobes modulates the sensitivity of stable, slowly-adapting responses
    in the temporal lobes.
