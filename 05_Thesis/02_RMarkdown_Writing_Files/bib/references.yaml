- id: Baese-Berk2022nature
  abstract: >-
    Most current theories and models of second language speech perception are
    grounded in the notion that learners acquire speech sound categories in
    their target language. In this paper, this classic idea in speech perception
    is revisited, given that clear evidence for formation of such categories is
    lacking in previous research. To understand the debate on the nature of
    speech sound representations in a second language, an operational definition
    of “category” is presented, and the issues of categorical perception and
    current theories of second language learning are reviewed. Following this,
    behavioral and neuroimaging evidence for and against acquisition of
    categorical representations is described. Finally, recommendations for
    future work are discussed. The paper concludes with a recommendation for
    integration of behavioral and neuroimaging work and theory in this area.
