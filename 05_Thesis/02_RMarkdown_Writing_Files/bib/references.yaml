- id: Oden1978Integration
  abstract: >-
    A model for the identification of speech sounds is proposed that assumes
    that (a) the acoustic cues are perceived independently, (b) the feature
    evaluation provides information about the degree to which each quality is
    present in the speech sound, (c) each speech sound is defined by a
    propositional prototype in long-term memory that determines how the featural
    information is integrated, and (d) the speech sound is identified on the
    basis of the relative degree to which it matches the various alternative
    prototypes. The model was supported by the results of an experiment in which
    Ss identified stop-consonant/vowel syllables that were factorially generated
    by independently varying acoustic cues for voicing and for place of
    articulation. This experiment, using 16 college community Ss, also
    replicated previous findings of changes in the identification boundary of
    one acoustic dimension as a function of the level of another dimension.
    These results have previously been interpreted as evidence for the
    interaction of the perceptions of the acoustic features themselves. In
    contrast, the present model provides a good description of the data,
    including these boundary changes, while still maintaining complete
    noninteraction at the feature evaluation stage of processing. (39 ref)
