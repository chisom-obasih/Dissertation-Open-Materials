- id: Cutting1974Categories
  abstract: >-
    Perceptual categories and boundaries arise when Ss respond to continuous
    variation on a physical dimension in a discontinuous fashion. It is more
    difficult to discriminate between members of the same category than to
    discriminate between members of different categories, even though the amount
    of physical difference between both pairs is the same. Speech stimuli have
    been the sole class of auditory signals to yield such perception; for
    example, each different consonant phoneme serves as a category label.
    Experiment I demonstrates that categories and boundaries occur for both
    speechand nonspeech stimuli differing in rise time. Experiment II shows that
    rise time cues categorical differences in both complex and simple nonspeech
    waveforms. Taken together, these results suggest that certain aspects of
    speech perception are intimately related to processes and mechanisms
    exploited in other domains. The many categories in speech may be based on
    categories that occur elsewhere in auditory perception.
