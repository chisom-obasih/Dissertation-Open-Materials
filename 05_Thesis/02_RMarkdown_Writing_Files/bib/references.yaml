- id: Ferrero1982Continuous
  abstract: >-
    The experiments reported here aimed to examine the mode of perception of a
    series of synthetic speech stimuli /sa-tsa/ and /∫a-t ∫a/, differing
    systematically in the duration of the frication. It was thought that a
    continuous perception could be shown for the fricatives if their acoustic
    characteristics were rendered more prominent for the discrimination task, by
    including stimuli of shortened duration in the continuum. The results
    indicated a rather categorical perception suggesting that the availability
    of acoustic information in auditory memory is immaterial for producing
    continuous perception in a discrimination task. However, definitive
    conclusions with regard to the perception of this particular continuum could
    not be drawn. The results obtained in both experiments for the stimuli
    having the shortest frication showed a significant difference between
    obtained and predicted discrimination functions. This effect may be
    attributed to the ratio between the duration of the frication noise and the
    duration of the entire stimulus.
