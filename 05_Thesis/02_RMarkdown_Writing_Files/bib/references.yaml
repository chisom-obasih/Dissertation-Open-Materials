- id: Idemaru2008Acoustic
  abstract: >-
    This study explores acoustic correlates to the singleton vs. geminate stop
    length contrast in Japanese. The proposal examined is that multiple acoustic
    features covary with the stop length distinction and that these features are
    available in the signal as potential secondary cues. The results support the
    proposal, revealing the presence of several acoustic features covarying with
    the singleton vs. geminate contrast in both durational and non-durational
    domains. Specifically, the preceding vowel is longer, the following vowel is
    shorter, there are greater fundamental frequency and intensity changes from
    the preceding to the following vowel, and there is evidence of more
    creakiness in voice quality for geminate than singleton consonants. It is
    also demonstrated that the vowel durations, as well as fundamental frequency
    and intensity changes have fairly strong categorization power.
