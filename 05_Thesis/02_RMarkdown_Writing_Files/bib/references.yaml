- id: Matusevych2023Infant
  abstract: >-
    In the first year of life, infants' speech perception becomes attuned to the
    sounds of their native language. This process of early phonetic learning has
    traditionally been framed as phonetic category acquisition. However, recent
    studies have hypothesized that the attunement may instead reflect a
    perceptual space learning process that does not involve categories. In this
    article, we explore the idea of perceptual space learning by implementing
    five different perceptual space learning models and testing them on three
    phonetic contrasts that have been tested in the infant speech perception
    literature. We reproduce and extend previous results showing that a
    perceptual space learning model that uses only distributional information
    about the acoustics of short time slices of speech can account for at least
    some crosslinguistic differences in infant perception. Moreover, we find
    that a second perceptual space learning model, which benefits from
    word-level guidance. performs equally well in capturing crosslinguistic
    differences in infant speech perception. These results provide support for
    the general idea of perceptual space learning as a theory of early phonetic
    learning but suggest that more fine-grained data are needed to distinguish
    between different formal accounts. Finally, we provide testable empirical
    predictions of the two most promising models and show that these are not
    identical, making it possible to independently evaluate each model in
    experiments with infants in future research.
