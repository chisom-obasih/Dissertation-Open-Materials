- id: McMurray2002Gradient
  abstract: >-
    In order to determine whether small within-category differences in voice
    onset time (VOT) affect lexical access, eye movements were monitored as
    participants indicated which of four pictures was named by spoken stimuli
    that varied along a 0–40 ms VOT continuum. Within-category differences in
    VOT resulted in gradient increases in fixations to cross-boundary lexical
    competitors as VOT approached the category boundary. Thus, fine-grained
    acoustic/phonetic differences are preserved in patterns of lexical
    activation for competing lexical candidates and could be used to maximize
    the efficiency of on-line word recognition.
