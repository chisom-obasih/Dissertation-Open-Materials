- id: Ou2021Individual
  abstract: >-
    Recent studies have documented substantial variability among typical
    listeners in how gradiently they categorize speech sounds, and this
    variability in categorization gradience may link to how listeners weight
    different cues in the incoming signal. The present study tested the
    relationship between categorization gradience and cue weighting across two
    sets of English contrasts, each varying orthogonally in two acoustic
    dimensions. Participants performed a four-alternative forced-choice
    identification task in a visual world paradigm while their eye movements
    were monitored. We found that (a) greater categorization gradience derived
    from behavioral identification responses corresponds to larger secondary cue
    weights derived from eye movements; (b) the relationship between
    categorization gradience and secondary cue weighting is observed across cues
    and contrasts, suggesting that categorization gradience may be a consistent
    within-individual property in speech perception; and (c) listeners who
    showed greater categorization gradience tend to adopt a buffered processing
    strategy, especially when cues arrive asynchronously in time.
