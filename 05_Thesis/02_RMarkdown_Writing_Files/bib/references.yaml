- id: Martin2013Learning
  abstract: >-
    Before the end of the first year of life, infants begin to lose the ability
    to perceive distinctions between sounds that are not phonemic in their
    native language. It is typically assumed that this developmental change
    reflects the construction of language-specific phoneme categories, but how
    these categories are learned largely remains a mystery. Peperkamp, Le
    Calvez, Nadal, and Dupoux (2006) present an algorithm that can discover
    phonemes using the distributions of allophones as well as the phonetic
    properties of the allophones and their contexts. We show that a third type
    of information source, the occurrence of pairs of minimally differing word
    forms in speech heard by the infant, is also useful for learning phonemic
    categories and is in fact more reliable than purely distributional
    information in data containing a large number of allophones. In our model,
    learners build an approximation of the lexicon consisting of the
    high-frequency n-grams present in their speech input, allowing them to take
    advantage of top-down lexical information without needing to learn words.
    This may explain how infants have already begun to exhibit sensitivity to
    phonemic categories before they have a large receptive lexicon.
