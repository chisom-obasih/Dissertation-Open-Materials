- id: Werker1985Crosslanguage
  abstract: >-
    A continuing controversy concerns whether speech perception can be best
    explained by single-factor psychoacoustic models, single-factor specialized
    linguistic models, or dual-factor models including both phonetic and
    psychoacoustic processes. However, our recent cross-language speech
    perception research has provided data suggesting that a three-factor model,
    including auditory, phonetic, and phonemic processing, may be necessary to
    accommodate existing findings. In the present article, we report the
    findings from three experiments designed to determine whether three separate
    processing factors are used in speech perception. In these experiments,
    English and Hindi subjects were tested in a same-different (AX)
    discrimination procedure. The duration of the interstimulus interval, the
    number of trials, and the experimental context were manipulated when testing
    the English-speaking subjects. The combined results from the three
    experiments provide support for the existence of three distinct
    speech-perception factors.
