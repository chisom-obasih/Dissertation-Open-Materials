- id: Kalamala2022multidimensionality
  abstract: >-
    The multidimensionality of the bilingual experience makes the investigation
    of bilingualism fascinating but also challenging. Although the literature
    distinguishes several aspects of bilingualism, the measurement methods and
    the relationships between these aspects have not been clearly established.
    In a group of 171 relatively young Polish–English bilinguals living in their
    first-language environment, this study investigates the relationships
    between the multiple measures of bilingualism. The study shows that language
    entropy – an increasingly popular measure of the diversity of language use –
    reflects a separate aspect of the bilingual experience from
    language-switching and language-mixing measures. The findings also indicate
    that language proficiency is not a uniform aspect of the bilingual
    experience but a complex construct that requires appropriately comprehensive
    measurements. Collectively, the findings contribute to the discussion on the
    best practices for quantifying bilingualism.
