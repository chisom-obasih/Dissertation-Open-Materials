- id: Sorensen2024Bayesian
  abstract: >-
    In another aspect, Bayesian modeling techniques are explored in the context
    of hearing status affecting academic outcomes. This is motivated by a study
    of adolescents across primary school with various degrees of hearing loss
    whom were observed in order to map the potential linkage between hearing
    difficulty and academic outcomes. As part of the study, participants were
    evaluated across multiple testing items meant to assess reading
    comprehension and word reading ability. While this study lends itself well
    to an item response theory (IRT) modeling approach, standard implementations
    of IRT modeling are unable to handle all the statistical considerations of
    the study, which includes, correlated latent abilities, participants being
    measured across time, testing items being applied at different rates across
    time, and a non-linear latent growth trend over time. Thus, a Bayesian
    hierarchical model using the two-parameter logistic function as a framework
    is proposed which can adequately accomplish all the goals of the study.
    Overall, negative associations between reading, both general comprehension
    and word-level ability, and better ear pure tone average were witnessed.
