- id: Kutlu2022Moving
  abstract: >-
    For much of its history, categorical perception was treated as a
    foundational theory of speech perception, which suggested that
    quasi-discrete categorization was a goal of speech perception. This had a
    profound impact on bilingualism research which adopted similar tasks to use
    as measures of nativeness or native-like processing, implicitly assuming
    that any deviation from discreteness was a deficit. This is particularly
    problematic for listeners like heritage speakers whose language proficiency,
    both in their heritage language and their majority language, is questioned.
    However, we now know that in the monolingual listener, speech perception is
    gradient and listeners use this gradiency to adjust subphonetic details,
    recover from ambiguity, and aid learning and adaptation. This calls for new
    theoretical and methodological approaches to bilingualism. We present the
    Visual Analogue Scaling task which avoids the discrete and binary
    assumptions of categorical perception and can capture gradiency more
    precisely than other measures. Our goal is to provide bilingualism
    researchers new conceptual and empirical tools that can help examine speech
    categorization in different bilingual communities without the necessity of
    forcing their speech categorization into discrete units and without assuming
    a deficit model.
