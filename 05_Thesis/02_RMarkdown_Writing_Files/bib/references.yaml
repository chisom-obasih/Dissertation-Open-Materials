- id: Gerrits2004Categorical
  abstract: >-
    Speech sounds are said to be perceived categorically. This notion is usually
    operationalized as the extent to which discrimination of stimuli is
    predictable from phoneme classification of the same stimuli. In this
    article, vowel continua were presented to listeners in a four-interval
    discrimination task (2IFC with flankers, or 4I2AFC) and a classification
    task. The results showed that there was no indication of categorical
    perception at all, since observed discrimination was found not to be
    predictable from the classification data. Variation in design, such as
    different step sizes or longer interstimulus intervals, did not affect this
    outcome, but a 2IFC experiment (without flankers, or 2I2AFC) involving the
    same stimuli elicited the traditional categorical results. These results
    indicate that the four-interval task made it difficult for listeners to use
    phonetic information and, hence, that categorical perception may be a
    function of the type of task used for discrimination. (PsycINFO Database
    Record (c) 2016 APA, all rights reserved)
