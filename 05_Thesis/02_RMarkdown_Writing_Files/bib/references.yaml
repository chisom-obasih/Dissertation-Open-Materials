- id: Knightly2003Production
  abstract: >-
    The current study assessed whether overhearing Spanish during childhood
    helps later Spanish pronunciation in adulthood. Our preliminary report based
    on a subset of the data [Au et al., Psychol. Sci. 13, 238–243 (2002)]
    revealed that adults who overheard Spanish during childhood had better
    Spanish pronunciation, but not better morphosyntax, than adult learners of
    Spanish who had no childhood experience with Spanish. We now present data
    from the full sample with additional morphosyntax and pronunciation
    assessments, as well as measures to help rule out possible confounding
    prosodic factors such as speech rate, phrasing, and stress placement. Three
    groups of undergraduates were compared: 15 Spanish–English bilinguals
    (native Spanish speakers), 15 late learners of Spanish who overheard Spanish
    during childhood (childhood overhearers), 15 late learners of Spanish who
    had no regular experience with Spanish until middle or high school (typical
    late L2 learners). Results confirmed a pronunciation advantage for the
    childhood overhearers over the typical late L2 learners on all measures:
    phonetic analyses (VOT and degree of lenition), accent ratings (phoneme and
    story production), but no benefit in morphosyntax. Importantly, the
    pronunciation advantage did not seem attributable to prosodic factors. These
    findings illustrate the specificity of overhearers’ advantage to
    phonological production.
