- id: Takiguchi2010Effects
  abstract: >-
    This study examined the effect of a dynamic and a level F0 on the perceived
    duration in Tokyo Japanese. It was found that a rising F0 as well as a
    falling F0 affect the perceived vowel duration. Specifically, a falling F0
    increases the perceived vowel duration regardless of its position in a word
    compared to a level F0; on the other hand, a rising F0 shows the same effect
    only on the word final vowel and it decreases the perceived vowel duration
    in the word initial syllable.
