- id: Tejedor-Garcia2020Assessing
  abstract: >-
    Over the last few years, we have witnessed a growing interest in
    computer-assisted pronunciation training (CAPT) tools and the commercial
    success of foreign language teaching applications that incorporate speech
    synthesis and automatic speech recognition technologies. However, empirical
    evidence supporting the pedagogical effectiveness of these systems remains
    scarce. In this article, a minimal-pair-based CAPT tool that implements
    exposure–perception–production cycles and provides automatic feedback to
    learners is tested for effectiveness in training adult native Spanish users
    (English level B1–B2) in the production of a set of difﬁcult English sounds.
    Working under controlled conditions, a group of users took a pronunciation
    test before and after using the tool. Test results were considered against
    those of an in-classroom group who followed similar training within the
    traditional classroom setting. Results show a signiﬁcant pronunciation
    improvement among the learners who used the CAPT tool, as well as a
    correlation between human rater’s assessment of posttests and automatic CAPT
    assessment of users.
