- id: Iverson2012Auditory
  abstract: >-
    This study examined whether high-variability auditory training on natural
    speech can benefit experienced second-language English speakers who already
    are exposed to natural variability in their daily use of English. The
    subjects were native French speakers who had learned English in school;
    experienced listeners were tested in England and the less experienced
    listeners were tested in France. Both groups were given eight sessions of
    high-variability phonetic training for English vowels, and were given a
    battery of perception and production tests to evaluate their improvement.
    The results demonstrated that both groups learned to similar degrees,
    suggesting that training provides a type of learning that is distinct from
    that obtained in more naturalistic situations.
