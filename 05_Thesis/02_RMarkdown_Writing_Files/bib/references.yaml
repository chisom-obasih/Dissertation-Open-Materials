- id: Hickendorff2018Informative
  abstract: >-
    This article gives an introduction to latent class, latent proﬁle, and
    latent transition models for researchers interested in investigating
    individual diﬀerences in learning and development. The models allow
    analyzing how the observed heterogeneity in a group (e.g., individual
    diﬀerences in conceptual knowledge) can be traced back to underlying
    homogeneous subgroups (e.g., learners diﬀering systematically in their
    developmental phases). The estimated parameters include a characteristic
    response pattern for each subgroup, and, in the case of longitudinal data,
    the probabilities of transitioning from one subgroup to another over time.
    This article describes the steps involved in using the models, gives
    practical examples, and discusses limitations and extensions. Overall, the
    models help to characterize heterogeneous learner populations,
    multidimensional learning outcomes, non-linear learning pathways, and
    changing relations between learning processes. The application of these
    models can therefore make a substantial contribution to our understanding of
    learning and individual diﬀerences.
