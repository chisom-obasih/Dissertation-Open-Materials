- id: Abdulrahman2018Vowel
  abstract: >-
    This paper investigates vowel length in Arabic and how it gets affected by
    neighboring consonants, in particular when it occurs in geminated or
    non-geminated phonetic environment in words. The paper examines vowel length
    before and after geminated and non-geminated consonants. It also focuses on
    the length of geminated/non-geminated consonants themselves and the
    proportion between them. The present study also investigates the proportion
    of vowels to consonants in the words and the proportion of geminated words
    to their non-geminated counterparts as a whole. Eighteen geminated and
    non-geminated Arabic words are selected and recorded randomly by the
    researcher who is a native speaker of Arabic. The data were recorded at the
    Phonetics Lab of the English and Foreign Languages University in
    Hyderabad/India. It was concluded that gemination in Arabic affects vowel
    and consonants as well as total length/ duration of the word as a whole. It
    is also observed that some vowels/ consonants have greater proportion than
    their non-geminated counterparts. The whole words were also affected by
    germination in terms of length and duration.
