- id: Kang2023Multilingual
  abstract: >-
    The use of multiple languages has been found to influence individuals’
    cognitive abilities. Although some studies have also investigated the effect
    of multilingualism on non-native language proficiency, fewer studies have
    focused on how multilingual experience affects native language production.
    This study investigated the effect of multilingualism on native language
    production, specifically examining control demands through a semantic
    Go/No-Go picture naming task. The multilingual experience was quantified
    using language entropy, which measures the uncertainty and diversity of
    language use. Control demands were achieved by manipulating the proportion
    of Go (i.e., naming) trials in different conditions. Results showed that as
    control demands increased, multilingual individuals exhibited poorer
    behavioral performance and greater brain activation throughout the brain.
    Moreover, more diverse language use was associated with higher accuracy in
    naming and more interconnected brain networks with greater involvement of
    domain-general neural resources and less domain-specific neural resources.
    Notably, the varied and balanced use of multiple languages enabled
    multilingual individuals to respond more efficiently to increased task
    demands during native language production.
