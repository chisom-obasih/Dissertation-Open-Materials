- id: Hillenbrand2000effects
  abstract: >-
    This study was designed to examine the role of duration in vowel perception
    by testing listeners on the identification of CVC syllables generated at
    different durations. Test signals consisted of synthesized versions of 300
    utterances selected from a large, multitalker database of /hVd/ syllables
    [Hillenbrand et al., J. Acoust. Soc. Am. 97, 3099–3111 (1995)]. Four
    versions of each utterance were synthesized: (1) an original duration set
    (vowel duration matched to the original utterance), (2) a neutral duration
    set (duration fixed at 272 ms, the grand mean across all vowels), (3) a
    short duration set (duration fixed at 144 ms, two standard deviations below
    the mean), and (4) a long duration set (duration fixed at 400 ms, two
    standard deviations above the mean). Experiment 1 used a formant
    synthesizer, while a second experiment was an exact replication using a
    sinusoidal synthesis method that represented the original vowel spectrum
    more precisely than the formant synthesizer. Findings included (1) duration
    had a small overall effect on vowel identity since the great majority of
    signals were identified correctly at their original durations and at all
    three altered durations; (2) despite the relatively small average effect of
    duration, some vowels, especially /ɑ/-/ɔ/-/ʌ/ and /æ/-/ɛ/, were
    significantly affected by duration; (3) some vowel contrasts that differ
    systematically in duration, such as /i/-/ɪ/, /u/-/ᴜ/, and /ɪ/-/e/-/ɛ/, were
    minimally affected by duration; (4) a simple pattern recognition model
    appears to be capable of accounting for several features of the listening
    test results, especially the greater influence of duration on some vowels
    than others; and (5) because a formant synthesizer does an imperfect job of
    representing the fine details of the original vowel spectrum, results using
    the formant-synthesized signals led to a slight overestimate of the role of
    duration in vowel recognition, especially for the shortened vowels.
