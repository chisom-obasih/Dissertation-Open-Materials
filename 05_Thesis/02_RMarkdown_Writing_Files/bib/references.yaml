- id: Flege1989Nativelanguage
  abstract: >-
    A contrast between /t/ and /d/ exists in the initial but not the final
    position of Chinese words. This study examined identification of English
    word-final /t/ and /d/ tokens from which closure voicing and release burst
    cues had been removed. The performance of three Chinese groups was compared
    before, during, and after feedback training. The Cantonese subjects were
    expected to perform best because their L1 permits unreleased /p, t, k/ in
    word-final position, and the Mandarin subjects were expected to perform most
    poorly because their L1 permits no word-final obstruents. An intermediate
    level of performance was expected from the Shanghainese subjects, whose L1
    permits /?/ word-finally. As predicted, the Cantonese subjects were
    significantly more sensitive to the English /t/–/d/ contrast than the
    Mandarin subjects, with the Shanghainese subjects showing an intermediate
    level of performance. The subjects in all three groups showed a significant
    increase in sensitivity as a result of the training. The increase in correct
    identifications averaged 25%. The results were interpreted to mean that
    native-language phonotactic constraints influence how syllables are
    processed. More specifically, it is concluded that the Cantonese subjects
    focused greater attention on the end of the consonant–vowel–consonant
    stimuli than the Mandarin subjects, which better enabled them to use
    remaining acoustic cues to the /t/–/d/ contrast such as F1 offset frequency.
