- id: Winn2020Manipulation
  abstract: >-
    Voice onset time (VOT) is an acoustic property of stop consonants that is
    commonly manipulated in studies of phonetic perception. This paper contains
    a thorough description of the “progressive cutback and replacement” method
    of VOT manipulation, and comparison with other VOT manipulation techniques.
    Other acoustic properties that covary with VOT—such as fundamental frequency
    and formant transitions—are also discussed, along with considerations for
    testing VOT perception and its relationship to various other measures of
    auditory temporal or spectral processing. An implementation of the
    progressive cutback and replacement method in the Praat scripting language
    is presented, which is suitable for modifying natural speech for perceptual
    experiments involving VOT and/or related covarying F0 and intensity cues.
    Justifications are provided for the stimulus design choices and constraints
    implemented in the script.
