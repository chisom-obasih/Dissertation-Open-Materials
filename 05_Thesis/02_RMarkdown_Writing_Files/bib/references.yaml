- id: Feldman2021Infants
  abstract: >-
    Early changes in infants’ ability to perceive native and nonnative speech
    sound contrasts are typically attributed to their developing knowledge of
    phonetic categories. We critically examine this hypothesis and argue that
    there is little direct evidence of category knowledge in infancy. We then
    propose an alternative account in which infants’ perception changes because
    they are learning a perceptual space that is appropriate to represent
    speech, without yet carving up that space into phonetic categories. If
    correct, this new account has substantial implications for understanding
    early language development.
