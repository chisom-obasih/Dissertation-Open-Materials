- id: Flege1995Second
  abstract: >-
    The aim of our research is to understand how speech learning changes over
    the life span and to explain why "earlier is better" as far as learning to
    pronounce a second language (L2) is concerned. An assumption we make is that
    the phonetic systems used in the production and perception of vowels and
    consonants remain adaptiive over the life span, and that phonetic systems
    reorganize in response to sounds encountered in an L2 through the addition
    of new phonetic categories, or through the modification of old ones. The
    chapter is organized in the following way. Several general hypotheses
    concerning the cause of foreign accent in L2 speech production are
    summarized in the introductory section. In the next section, a model of L2
    speech learning that aims to account for age-related changes in L2
    pronunciation is presented. The next three sections present summaries of
    empirical research dealing with the production and perception of L2 vowels,
    word-initial consonants, and word-final consonants. The final section
    discusses questions of general theoretical interest, with special attention
    to a featural (as opposed to a segmental) level of analysis. Although
    nonsegmental (i.e., prosodic) dimensions are an important source of foreign
    accent, the present chapter focuses on phoneme-sized units of speech.
    Although many different languages are learned as an L2, the focus is on the
    acquisition of English.
