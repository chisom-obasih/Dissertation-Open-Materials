- id: Werker2005Infant
  abstract: >-
    By their first birthday, infants can understand many spoken words. Research
    in cognitive development has long focused on the conceptual changes that
    accompany word learning, but learning new words also entails perceptual
    sophistication. Several developmental steps are required as infants learn to
    segment, identify and represent the phonetic forms of spoken words, and map
    those word forms to different concepts. We review recent research on how
    infants' perceptual systems unfold in the service of word learning, from
    initial sensitivity for speech to the learning of language-specific sound
    patterns. Building on a recent theoretical framework and emerging new
    methodologies, we show how speech perception is crucial for word learning,
    and suggest that it bootstraps the development of a separate but parallel
    phonological system that links sound to meaning.
