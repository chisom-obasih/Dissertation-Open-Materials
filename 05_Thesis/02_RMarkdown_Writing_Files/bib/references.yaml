- id: Miller1997Internal
  abstract: "A fundamental issue in speech perception is how listeners map the continuously varying acoustic signal of speech onto the discrete phonetic categories of language. Although much of the research on phonetic categorisation has focused on the boundaries between categories, there is growing interest in the “centres” of categories. This results from the discovery that phonetic categories, like perceptual/cognitive categories in general (Medin & Barsalou, 1987), have a graded internal structure. That is, some stimuli within a given category are perceived as better exemplars or more prototypical than others, and they are functionally more salient (e.g. Kuhl, 1991; Miller, 1994; Oden & Massaro, 1978; Repp, 1977; Samuel, 1982). This paper highlights \x8Endings from our research that help to characterise the nature of internal category structure in adults, and its origins in early infancy."
