- id: Anderson2018language
  abstract: >-
    Research examining the cognitive consequences of bilingualism has expanded
    rapidly in recent years and has revealed effects on aspects of cognition
    across the lifespan. However, these effects are difficult to find in studies
    investigating young adults. One problem is that there is no standard
    definition of bilingualism or means of evaluating degree of bilingualism in
    individual participants, making it difficult to directly compare the results
    of different studies. Here, we describe an instrument developed to assess
    degree of bilingualism for young adults who live in diverse communities in
    which English is the official language. We demonstrate the reliability and
    validity of the instrument in analyses based on 408 participants. The
    relevant factors for describing degree of bilingualism are: (1) the extent
    of non-English language proficiency and use at home, and (2) non-English
    language use socially. We then use the bilingualism scores obtained from the
    instrument to demonstrate their association with: (1) performance on
    executive function tasks, and (2) previous classifications of participants
    into categories of monolinguals and bilinguals.
