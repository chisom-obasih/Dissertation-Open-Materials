- id: Kong2019Individual
  abstract: >-
    This study investigated individual variability of L2 learners’ categorical
    judgments of L2 stops by exploring English learners’ perceptual processing
    of two acoustic cues (voice onset time \[VOT] and <italic>f0</italic>) and
    working memory capacity as sources of variation. As prior research has
    reported that English speakers’ greater use of the redundant cue
    <italic>f0</italic> was responsible for gradient processing of native stops,
    we examined whether the same processing characteristics would be observed in
    L2 learners’ perception of Korean stops (/t/–/t^h^/). 22 English learners of
    L2 Korean with a range of L2 proficiency participated in a visual analogue
    scaling task and demonstrated variable manners of judging the L2 Korean
    stops: Some were more gradient than others in performing the task.
    Correlation analysis revealed that L2 learners’ categorical responses were
    modestly related to individuals’ utilizations of a primary cue for the stop
    contrast (VOT for L1 English stops and <italic>f0</italic> for L2 Korean
    stops), and were also related to better working memory capacity. Together,
    the current experimental evidence demonstrates adult L2 learners’ top-down
    processing of stop consonants where linguistic and cognitive resources are
    devoted to a process of determining abstract phonemic identity.
