- id: Cutler2010How
  abstract: >-
    Listeners can cope with considerable variation in the way that different
    speakers talk. We argue here that they can do so because of a process
    ofphonological abstraction in the speech-recognition system. We review
    evidence that listeners adjust the bounds ofphonemic categories after only
    very limited exposure to a deviant realisation ofa given phoneme. This
    learning can be talker-specific and is stable over time; further, the
    learning generalizes to previously unheard words containing the deviant
    phoneme. Together these results suggest that the learning involves
    adjustment ofprelexical phonemic representations which mediate between the
    speech signal and the mental lexicon during word recognition. We argue that
    such an abstraction process is inconsistent with claims made by some recent
    models oflanguage processing that the mental lexicon consists solely
    ofmultiple detailed traces ofacoustic episodes. Simulations with a purely
    episodic model without functional prelexical abstraction confirm that such a
    model cannot account for the evidence on lexical generalization ofperceptual
    learning. We conclude that abstract phonemic categories form a necessary
    part of lexical access, and that the ability to store talker-specific
    knowledge about those categories provides listeners with the means to deal
    with cross-talker variation.
