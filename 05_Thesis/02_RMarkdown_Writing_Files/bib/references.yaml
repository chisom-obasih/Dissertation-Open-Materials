- id: Getz2021timecourse
  abstract: >-
    Recent advances in cognitive neuroscience have provided a detailed picture
    of the early time-course of speech perception. In this review, we highlight
    this work, placing it within the broader context of research on the
    neurobiology of speech processing, and discuss how these data point us
    toward new models of speech perception and spoken language comprehension. We
    focus, in particular, on temporally-sensitive measures that allow us to
    directly measure early perceptual processes. Overall, the data provide
    support for two key principles: (a) speech perception is based on gradient
    representations of speech sounds and (b) speech perception is interactive
    and receives input from higher-level linguistic context at the earliest
    stages of cortical processing. Implications for models of speech processing
    and the neurobiology of language more broadly are discussed. This article is
    categorized under: Psychology > Language Psychology > Perception and
    Psychophysics Neuroscience > Cognition
