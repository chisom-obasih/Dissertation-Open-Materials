- id: Wigdorowitz2022Sociolinguistic
  abstract: >-
    Individual reports of language history, use, and proficiency are generally
    considered sufficient for language profiling. Yet, these variables alone
    neglect the contribution of contextual linguistic diversity to one’s overall
    language repertoire. In this study we used the Contextual Linguistic Profile
    Questionnaire to evaluate whether there is a difference in contextual
    linguistic diversity between participants across the linguistically
    dissimilar contexts of South Africa and England. We further assessed whether
    self-reported lingualism status groups (monolinguals, bilinguals,
    multilinguals) scored differently on contextual linguistic diversity to
    evaluate the utility and uniformity of categorical labels across varying
    contexts, and investigated how codeswitching and socio-economic status
    contributed to these effects. Our results demonstrated that contextual
    linguistic diversity differs between nations: South Africans score higher,
    promotion of multilingualism is dependent on socio-economic status only in
    England, lingualism status is not contextually comparable when measured
    categorically, and codeswitching accounts for linguistic features of South
    Africans.
