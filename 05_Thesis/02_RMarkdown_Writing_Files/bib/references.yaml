- id: Lo2015transform
  abstract: >-
    Linear mixed-effect models (LMMs) are being increasingly widely used in
    psychology to analyse multi-level research designs. This feature allows LMMs
    to address some of the problems identified by Speelman and McGann (2013)
    about the use of mean data, because they do not average across individual
    responses. However, recent guidelines for using LMM to analyse skewed
    reaction time (RT) data collected in many cognitive psychological studies
    recommend the application of non-linear transformations to satisfy
    assumptions of normality. Uncritical adoption of this recommendation has
    important theoretical implications which can yield misleading conclusions.
    For example, Balota, Aschenbrenner and Yap (2013) showed that analyses of
    raw RT produced additive effects of word frequency and stimulus quality on
    word identification, which conflicted with the interactive effects observed
    in analyses of transformed RT. Generalized linear mixed-effect models (GLMM)
    provide a solution to this problem by satisfying normality assumptions
    without the need for transformation. This allows differences between
    individuals to be properly assessed, using the metric most appropriate to
    the researcher’s theoretical context. We outline the major theoretical
    decisions involved in specifying a GLMM, and illustrate them by reanalysing
    Balota et al.’s datasets. We then consider the broader benefits of using
    GLMM to investigate individual differences.
