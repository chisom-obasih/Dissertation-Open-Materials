- id: Mairano2016Are
  abstract: >-
    In this contribution we address the usage of minimal pairs in L2
    pronunciation classes. An informal survey with FL teachers of Italian and
    English revealed that minimal pairs are considered to be scant and difficult
    to find. We present here a tool (Minimal Pair Finder) that has been
    developed with the aim to support teachers and learners in pronunciation
    classes by providing quick access to several minimal pairs via a top-down
    approach. We describe how this tool can be consulted, how it has been
    implemented, and we show a sample teaching unit where students are asked to
    make use of it. Minimal Pair Finder reveals that minimal pairs are generally
    not too few to be used in pronunciation classes; however, we argue that L2
    teachers should wisely choose minimal pairs for their classes based on the
    proficiency level of their students, by paying attention to parameters such
    as productivity and word frequency.
