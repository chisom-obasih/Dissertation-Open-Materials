- id: Mora2019Contributions
  abstract: >-
    This study examined the effect of cognitive attention control on L2
    phonological development from an individual differences perspective. L1-
    Catalan/Spanish learners of L2-English were trained on the perception and
    production of English /æ/-/ʌ/ and /i:/-/I/ through AX discrimination,
    identification immediate repetition tasks. Learners’ gains in L2
    phonological development were assessed through L2 perception (ABX
    discrimination and lexical decision) tests. Additionally, we obtained
    individual measures of auditory selective attention, auditory attention
    switching and auditory inhibition and a measure of overall L2 proficiency.
    Results revealed robust gains in L2 perception for both target contrasts.
    Auditory selective attention scores were signifi cantly related to learners’
    gains in /æ/-/ʌ/ perception, and attention switching skills to performance
    in the ABX discrimination tests. Overall the results highlight the role of
    cognitive attention control in L2 speech learning.
