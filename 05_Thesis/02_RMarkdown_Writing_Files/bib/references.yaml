- id: Holt2008Speech
  abstract: >-
    The complexities of the acoustic speech signal pose many significant
    challenges for listeners. Although perceiving speech begins with auditory
    processing, investigation of speech perception has progressed mostly
    independently of study of the auditory system. Nevertheless, a growing body
    of evidence demonstrates that cross-fertilization between the two areas of
    research can be productive. We briefly describe research bridging the study
    of general auditory processing and speech perception, showing that the
    latter is constrained and influenced by operating characteristics of the
    auditory system and that our understanding of the processes involved in
    speech perception is enhanced by study within a more general framework. The
    disconnect between the two areas of research has stunted the development of
    a truly interdisciplinary science, but there is an opportunity for great
    strides in understanding with the development of an integrated field of
    auditory cognitive science.
