- id: Li2006Language
  abstract: >-
    A Web-based interface has been developed to facilitate researchers in
    collecting language history information online. Most researchers use their
    own versions of language history questionnaires for specific studies in
    second language acquisition. Although these versions of questionnaires all
    differ from one another in some respects, there is a significant amount of
    overlap between them. Here we identify the crucial dimensions that most
    investigators consider important to include in such a questionnaire. We have
    examined the most commonly asked questions in 41 published questionnaires,
    and on the basis of our analyses we propose a general L2 language history
    questionnaire. Subjects can enter some or all of the information on the Web,
    and the results are automatically generated as an RTF output file on the
    user’s desktop.
