- id: Clayards2008Perception
  abstract: >-
    Listeners are exquisitely sensitive to fine-grained acoustic detail within
    phonetic categories for sounds and words. Here we show that this sensitivity
    is optimal given the probabilistic nature of speech cues. We manipulated the
    probability distribution of one probabilistic cue, voice onset time (VOT),
    which differentiates word initial labial stops in English (e.g., “beach” and
    “peach”). Participants categorized words from distributions of VOT with wide
    or narrow variances. Uncertainty about word identity was measured by
    four-alternative forced-choice judgments and by the probability of looks to
    pictures. Both measures closely reflected the posterior probability of the
    word given the likelihood distributions of VOT, suggesting that listeners
    are sensitive to these distributions.
  accessed:
