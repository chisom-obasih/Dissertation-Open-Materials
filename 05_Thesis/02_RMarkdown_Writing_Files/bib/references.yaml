- id: Earle2014Building
  abstract: >-
    <p>The current review provides specific predictions for the role of
    sleep-mediated memory consolidation in the formation of new speech sound
    representations. Specifically, this discussion will highlight selected
    literature on the different ideas concerning category representation in
    speech, followed by a broad overview of memory consolidation and how it
    relates to human behavior, as relevant to speech/perceptual learning. In
    combining behavioral and physiological accounts from animal models with
    insights from the human consolidation literature on auditory skill/word
    learning, we are in the early stages of understanding how the transfer of
    experiential information between brain structures during sleep manifests in
    changes to online perception. Arriving at the conclusion that this process
    is crucial in perceptual learning and the formation of novel categories,
    further speculation yields the adjacent claim that the habitual disruption
    in this process leads to impoverished quality in the representation of
    speech sounds.</p>
