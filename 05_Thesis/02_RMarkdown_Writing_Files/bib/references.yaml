- id: Sonu2011Perceptual
  abstract: >-
    In an attempt to improve the perception of vowel length contrasts in
    Japanese by L2 learners (L1 Korean), we compared two different training
    methods. The first one involved training L2 learners with sets of isolated
    words contrasting the vowels (Word training), whereas the other training
    involved presenting same words within sentences (Sentence training). Word
    training and sentence training both led to significant improvement in the
    learners’ ability to identify vowel length contrasts in Japanese, and, both
    types of training improved the listeners’ ability to perceive consonant
    length contrasts in Japanese, which listeners were not trained to identify.
    Although the amount of overall improvement was not significantly different
    between training methods, sentence training showed improvement in a wider
    range of conditions than word training. These results indicate that word
    training and sentence training are both effective at improving perception of
    length contrasts in Japanese, but that sentence training may have some
    advantage over word training.
