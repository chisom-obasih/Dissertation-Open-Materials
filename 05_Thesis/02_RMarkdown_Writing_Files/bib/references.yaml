- id: Samuel2015Does
  abstract: >-
    Previous research with highly ﬂuent, very early, Catalan–Spanish bilinguals
    has shown that L1 Spanish bilinguals accept certain mispronounced Catalan
    words at extremely high rates, and even L1 Catalan bilinguals do so at
    surprisingly high rates. Using similarly highly ﬂuent, very early
    Basque–Spanish bilinguals, we investigate why this occurs. We test three
    possibilities: (1) There could be a failure to distinguish two similar
    sounds at the phonetic level, (2) Listeners might store exemplars they have
    heard in their lexical representations, with one accurate and one
    mispronounced version, or (3) Listeners might map two different phonetic
    codes to a lexical representation, either during perception or in a
    developed representation. A discrimination test showed that the problem is
    not due to a failure in acoustic-phonetic processing. To test the
    dual-exemplar representation versus dual mapping alternatives, we taught our
    subjects new Basque words under conditions that only allowed for a single
    lexical representation. Listeners showed the same tolerance for erroneous
    pronunciations in these uniquely learned items, ruling out the dual lexical
    representation option and supporting dual mapping. In regions in which
    bilinguals routinely hear accented versions of their language, it is a
    useful adaptation to the resulting variation to treat certain sounds as
    allophonic for purposes of lexical access. Looked at this way, accepting a
    ‘‘wrong’’ pronunciation is really not an error at all – it is an efﬁcient
    adaptation to the prevailing linguistic environment.
