- id: Kozasa2005acoustic
  abstract: >-
    This dissertation is about long vowels in Tokyo Japanese and Pohnpeian, a
    Micronesian language. Vowel length is contrastive in these two languages,
    and it is phonologically represented by mora counts. Long vowels carry two
    moras and short vowels one. The results from three production and three
    perception experiments show that the production and perception of vowel
    length is not identical between Japanese and Pohnpeian. The proportion of
    the duration of long to short vowels is much greater in Japanese.
    Furthermore, not only duration but also pitch fall is crucial for Japanese
    speakers in marking vowel length, and Pohnpeian speakers' use of durational
    cues differs from that of Japanese speakers. The phonetic implementations of
    long vowels seem to play an important role in the listeners' categorization
    of vowel length.

    The duration of vowels and the amount of pitch fall were measured. The ratio
    of the mean duration of long vowels to short vowels was not 2:1 in either
    language. In Japanese accented vowels, it was 1.65:1 in fast speech and
    1.77:1 in slow speech, and in Japanese unaccented vowels, it was 1.93:1 in
    fast speech and 2.42:1 in slow speech. In Pohnpeian, it was 1.30:1 in fast
    speech and 1.47:1 in slow speech.

    The duration of vowels was vulnerable to speech rates in both languages, but
    pitch fall in Japanese accented vowels was not. The durational distinction
    between long and short vowels was increased in Japanese unaccented vowels
    compared to accented vowels, and it was even greater as the speech rate
    decreased. These results indicate that both duration and pitch fall are
    important for Japanese speakers to mark phonological vowel length, while
    Pohnpeian speakers primarily used duration to mark vowel length.

    Patterns of vowel length categorization by each language listeners agreed
    with the results from production experiments. Japanese listeners'
    categorization of vowel length was affected by pitch fall. Even when the
    duration of vowels was equivalent to long vowels, Japanese listeners were
    not able to categorize vowel length without an adequate amount of pitch
    fall. Furthermore, they required longer duration than Pohnpeian listeners to
    perceive a vowel as long.
