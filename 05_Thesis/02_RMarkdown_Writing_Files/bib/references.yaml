- id: Mustafawi2018Arabic
  abstract: >-
    The systematic study of the phonology of Arabic was undertaken by Al-Khaliil
    and then elaborated on by his student Sibawayh in the 8th century. This
    chapter presents a general description and discussion of the phonology of
    Arabic. The sound system of Modern Standard Arabic (MSA) is briefly
    discussed and compared to the sound system of Classical Arabic (CA) as
    described by CA grammarians. Differences, or possible differences, between
    them are highlighted. The phonemic inventory of MSA is then compared to
    those of the other Arabic spoken varieties, conventionally classified into
    six main dialect groups from East to West: Gulf Arabic (GA), Iraqi Arabic
    (IA), Levantine Arabic (LA), Yemeni Arabic (YA), Egyptian Arabic (EA), and
    Maghrebi Arabic (MA). Comparisons among these varieties are drawn in terms
    of sound system, syllable structure, and stress patterns. Some sound
    alternations in different dialects are analyzed within an Obligatory Contour
    Principle (OCP)–driven framework. Additionally, processes such as
    assimilation, affrication, lenition, and pharyngealization are discussed.
