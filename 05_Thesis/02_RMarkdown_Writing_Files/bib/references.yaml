- id: Sulpizio2020Bilingualism
  abstract: >-
    There is currently no agreement on which factor modulates most effectively
    and enduringly brain plasticity in bilingual individuals. Grouping
    heterogeneous linguistic profiles under a dichotomous condition
    (bilingualism versus monolingualism) may obscure critical aspects of
    language experience underlying neural changes, thus leading to variable and
    often conflicting findings. In the present study, we overcome these
    limitations by analyzing the individual and joint contribution of L2 AoA,
    proficiency and usage – all measured as continuous variables – on the
    resting-state functional connectivity of the brain networks mediating the
    specific demands of bilingual language processing: the language network and
    the executive control network. Our results indicate that bilingual
    experience – defined as a continuous and multifaceted phenomenon – impacts
    brain plasticity by modulating the functional connectivity both within and
    between language and control networks. Each experience-related factor
    considered played a role in changing the connectivity of these regions.
    Moreover, the effect of AoA was modulated by proficiency and usage. These
    findings shed new light on the importance of modeling bilingualism as a
    gradient measure rather than an all-or-none phenomenon.
