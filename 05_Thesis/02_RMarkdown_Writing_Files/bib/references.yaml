- id: Kremin2021Why
  abstract: >-
    Aims and Objectives:Bilingualism is a complex construct, and it can be
    difficult to define and model. This paper proposes that the field of
    bilingualism can draw from other fields of psychology, by integrating
    advanced psychometric models that incorporate both categorical and
    continuous properties. These models can unify the widespread use of
    bilingual and monolingual groups that exist in the literature with recent
    proposals that bilingualism should be viewed as a continuous
    variable.Approach:In the paper, we highlight two models of potential
    interest: the factor mixture model and the grade-of-membership model. These
    models simultaneously allow for the formation of different categories of
    speakers and for continuous variation to exist within these categories. We
    discuss how these models could be implemented in bilingualism research,
    including how to develop these models. When using either of the two models,
    researchers can conduct their analyses on either the categorical or
    continuous information, or a combination of the two, depending on which is
    most appropriate to address their research question.Conclusions:The field of
    bilingualism research could benefit from incorporating more complex models
    into definitions of bilingualism. To help various subfields of bilingualism
    research converge on appropriate models, we encourage researchers to
    pre-register their model selection and planned analyses, as well as to share
    their data and analysis scripts.Originality:The paper uniquely proposes the
    incorporation of advanced statistical psychometric methods for defining and
    modeling bilingualism.Significance:Conceptualizing bilingualism within the
    context of these more flexible models will allow a wide variety of research
    questions to be addressed. Ultimately, this will help to advance theory and
    lead to a fuller and deeper understanding of bilingualism.
