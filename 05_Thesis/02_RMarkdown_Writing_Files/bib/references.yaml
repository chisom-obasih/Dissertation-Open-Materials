- id: Escudero2004Bridging
  abstract: >-
    A series of experiments shows that Spanish learners of English acquire the
    ship-sheep contrast in a way specific to their target dialect (Scottish or
    Southern British English) and that many learners exhibit a perceptual
    strategy found in neither Spanish nor English. To account for these facts as
    well as for the findings of earlier research on second language (L2) speech
    perception, we provide an Optimality Theoretic model of phonological
    categorization that comes with a formal learning algorithm for its
    acquisition. Within this model, the dialect-dependent and L2-specific facts
    provide evidence for the hypotheses of Full Transfer and Full Access.
