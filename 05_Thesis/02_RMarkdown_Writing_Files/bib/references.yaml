- id: Kubozono2011Pitch
  abstract: >-
    It is generally assumed in the literature that contrasts in phonological
    length are signaled primarily by phonetic durations. Consonant length in
    Japanese is no exception and is believed to be phonetically correlated with
    the closure duration (p, t, k) or frication duration (s, h) of the relevant
    consonant. This paper presents new experimental evidence that the
    phonological contrast between geminate and single consonants in Japanese is
    signaled not only by duration but by pitch as well. This implies that native
    speakers of Japanese employ pitch cues as a secondary cue to distinguish
    geminate consonants from singletons.
