- id: Burkner2017brms
  abstract: >-
    The brms package implements Bayesian multilevel models in R using the
    probabilistic programming language Stan. A wide range of distributions and
    link functions are supported, allowing users to fit  -  among others  - 
    linear, robust linear, binomial, Poisson, survival, ordinal, zero-inflated,
    hurdle, and even non-linear models all in a multilevel context. Further
    modeling options include autocorrelation of the response variable, user
    defined covariance structures, censored data, as well as meta-analytic
    standard errors. Prior specifications are flexible and explicitly encourage
    users to apply prior distributions that actually reflect their beliefs. In
    addition, model fit can easily be assessed and compared with the
    Watanabe-Akaike information criterion and leave-one-out cross-validation.
