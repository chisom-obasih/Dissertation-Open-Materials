- id: Haukas2021Developing
  abstract: >-
    Validation of data collection instruments is a necessary step in all
    research and should be regarded as an integral component in every stage of
    the research process; however, the validation process is often not accounted
    for in detail in published studies. The purpose of this paper is to describe
    the development and validation of the Ungspråk electronic questionnaire,
    which was designed to explore teenagers’ multilingualism and multilingual
    identity in the Norwegian school context. It aims to examine whether having
    a multilingual identity correlates with several variables such as language
    practices, languages studied in school, open-mindedness, and beliefs about
    multilingualism. To our knowledge, the Ungspråk questionnaire is one of the
    first validated tools for quantitatively investigating learners’
    multilingual identity in school settings. Different qualitative and
    quantitative procedures were adopted for validating Ungspråk, including
    piloting sessions with students from two lower secondary schools. The
    results of the validation processes suggest that the Ungspråk questionnaire
    is a robust instrument for investigating young learners’ multilingual
    identity. It is easy to use, acceptable to learners, and fulfils stringent
    criteria of reliability and validity.
