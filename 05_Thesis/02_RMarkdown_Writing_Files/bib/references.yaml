- id: Oller1975Dictation
  abstract: >-
    Since the publication of "Dictation as a Device for Testing Foreign Language
    Proficiency" in English Language Teaching (henceforth referred to as the
    1971 paper), 1 the utility of dictation for testing has been demonstrated
    repeatedly. It is an excellent measure of overall language proficiency
    (Johansson 1974; Oller 1972a, 1972b) and has proved useful as an elicitation
    technique for diagnostic data (Angelis 1974). Although some of the
    discussion concerning the validity of dictation has been skeptical (Rand
    1972; Breitenstein 1972), careful research increasingly supports confidence
    in the technique.The purpose of this paper is to present a re-evaluation of
    the 1971 paper. That data showed the Dictation scores on the UCLA English as
    a Second Language Placement Examination (UCLA ESLPE 1) correlated more
    highly with Total test scores and with other Part scores than did any other
    Part of the ESLPE. The re-evaluation was prompted by useful critiques (Rand
    1972; Breitenstein 1972) . An error in the computation of correlations
    between Part (subtest) scores and Total scores in that analysis is
    corrected; additional information concerning test rationale, administration,
    scoring, and interpretation is provided; and finally, a more comprehensive
    theoretical explanation is offered to account for the utility of dictation
    as a measure of language proficiency.
