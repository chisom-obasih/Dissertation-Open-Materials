- id: Titone2023Rethinking
  abstract: >-
    In “The Devil's Dictionary”, Bierce (1911) defined language as “The music
    with which we charm the serpents guarding another's treasure.” This
    satirical definition reflects a core truth – humans communicate using
    language to accomplish social goals. In this Keynote, we urge cognitive
    scientists and neuroscientists to more fully embrace sociolinguistic and
    sociocultural experiences as part of their theoretical and empirical
    purview. To this end, we review theoretical antecedents of such approaches,
    and offer a new framework – the Systems Framework of Bilingualism – that we
    hope will be useful in this regard. We conclude with new questions to nudge
    our discipline towards a more nuanced, inclusive, and socially-informed
    scientific understanding of multilingual experience. We hope to engage a
    wide array of researchers united under the broad umbrella of multilingualism
    (e.g., researchers in neurocognition, sociolinguistics, and applied
    scientists).
