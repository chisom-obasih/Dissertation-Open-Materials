- id: Kepinska2023Language
  abstract: >-
    Consequences of multilingualism vary from offering cognitive benefits to
    poor educational and cognitive outcomes. One aspect of multilingualism that
    has not been systematically examined is the typology of multilinguals'
    languages: Do differences and similarities between languages multilinguals
    are exposed to contribute to the development of their cognition and brain?
    We investigated n = 162 5–6-year-olds with various language backgrounds on a
    monolingual-to-quintilingual continuum. Our results show that typological
    linguistic diversity can be related to expressive vocabulary knowledge in
    the dominant language. On neural level, it relates to brain activation
    patterns in (among others) the PGa area in the bilateral IPL, a brain region
    previously associated with multilingual experience, but never with language
    typology. We propose an ecologically valid way of describing the continuum
    of multilingual language experience and provide evidence for both the
    cognition and the brain of multilingual kindergartners to be related to the
    typological linguistic diversity of their environment.
