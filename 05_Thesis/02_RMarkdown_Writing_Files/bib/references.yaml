- id: Nylund-Gibson2023Ten
  abstract: >-
    Latent transition analysis (LTA), also referred to as latent Markov
    modeling, is an extension of latent class/profile analysis (LCA/LPA) used to
    model the interrelations of multiple latent class variables. Given a growing
    interest and use of LTA in applied work, the current paper provides an
    introduction to LTA by answering 10 questions commonly asked by applied
    researchers about LTA. Topics discussed include: (1) an overview of LTA, (2)
    a comparison of LTA to other longitudinal models, (3) software used to run
    LTA, (4) sample size suggestions, (5) modeling steps in LTA, (6) measurement
    invariance, (7) the inclusion of auxiliary variables, (8) interpreting
    results of an LTA, (9) the nature of data (e.g., longitudinal,
    cross-sectional), and (10) extensions of LTA. An example of LTA applied to
    science attitude data is included to guide researchers in model building
    procedures and interpretation of results. Finally, the paper suggests future
    areas of growth for LTA. This paper provides researchers an overview of LTA
    highlighting key decisions researchers need to make to navigate and
    implement an LTA analysis from start to finish.
