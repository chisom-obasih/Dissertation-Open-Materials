- id: Iverson2005Phonetic
  abstract: >-
    Recent work [Iverson et al. (2003) Cognition, 87, B47–57] has suggested that
    Japanese adults have difficulty learning English /r/ and /l/ because they
    are overly sensitive to acoustic cues that are not reliable for /r/-/l/
    categorization (e.g., F2 frequency). This study investigated whether cue
    weightings are altered by auditory training, and compared the effectiveness
    of different training techniques. Separate groups of subjects received High
    Variability Phonetic Training (natural words from multiple talkers), and 3
    techniques in which the natural recordings were altered via signal
    processing (All Enhancement, with F3 contrast maximized and closure duration
    lengthened; Perceptual Fading, with F3 enhancement reduced during training;
    and Secondary Cue Variability, with variation in F2 and durations increased
    during training). The results demonstrated that all of the training
    techniques improved /r/-/l/ identification by Japanese listeners, but there
    were no differences between the techniques. Training also altered the use of
    secondary acoustic cues; listeners became biased to identify stimuli as
    English /l/ when the cues made them similar to the Japanese /r/ category,
    and reduced their use of secondary acoustic cues for stimuli that were
    dissimilar to Japanese /r/. The results suggest that both category
    assimilation and perceptual interference affect English /r/ and /l/
    acquisition.
