- id: Hirata2004Effects
  abstract: >-
    The issue of acoustic invariance was explored with the question of whether
    an absolute or relative duration value can be found to reliably classify the
    Japanese phonemic short and long vowels produced across different speaking
    rates. The stimuli were Japanese disyllabic non-words (Experiment 1) and
    real words (Experiment 2). Four native speakers produced these words in a
    carrier sentence at slow, normal, and fast rates. The duration of accented
    and unaccented short vowels in CV́CV contexts and contrasting long vowels in
    CV́VCV and CV́CVV contexts, as well as word duration, was measured. Rate
    changes affected the duration of long vowels more than short vowels in such
    a way that the duration difference between short and long vowels was greater
    for slow than normal, and for normal than fast speech. In contrast with the
    absolute durations, the ratios of long-to-short vowels and three-mora
    (CV́VCV or CV́CVV) to two-mora (CV́CV) words were less affected by rate
    changes. Furthermore, the proportion of the vowel to the total word duration
    was found to distinguish the two vowel length categories across three rates
    with high accuracy. The results support the view that “relational” acoustic
    invariance exists that remains stable across speakers and rates.
